server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Necessário para o Angular Router funcionar corretamente
    # Sem isso, ao dar F5 numa rota como /empreendimentos/novo, o Nginx retorna 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}